# Üretim kodunda (src/) sahte değer de olsa İZİN YOK — gerçek sır asla repoya yazılmaz (CLAUDE.md).
title = "lixus gitleaks"

[extend]
useDefault = true

[allowlist]
description = "test fikstürleri ve test yapılandırması (sahte değerler)"
paths = [
  '''^tests/''',
  '''^evals/''',
  '''^vitest(\.[a-z-]+)?\.config\.ts$''',
  '''^scripts/test-sentry-report\.ts$''',
]
