name: CI

on:
  push:
    # claude/great-edison-3zqpZ is the branch Railway auto-deploys from — CI must
    # run exactly where production commits land. The push run tests the exact
    # tree Railway ships, which is the true signal.
    branches: ["main", "claude/great-edison-3zqpZ"]
  # DEPENDABOT KAPISI (08-05). This trigger used to be absent, and
  # .github/dependabot.yml's own comment claimed "CI runs typecheck + tests on
  # each PR" — it did NOT. Dependency-update PRs could be merged having seen
  # ZERO verification, which is the cheapest supply-chain attack there is.
  #
  # The reason it was removed originally is real and still handled: the deploy
  # branch has a long-lived open PR, so an unfiltered pull_request trigger runs
  # every push a SECOND time against the PR merge ref (observed duplicate runs).
  # Each job below therefore carries `if: github.head_ref != '<deploy branch>'`,
  # which skips exactly that PR and nothing else. The guard keys on head_ref
  # (the SOURCE branch), so it does not depend on which base the PR targets.
  pull_request:
  workflow_dispatch:

# cancel-in-progress drops superseded runs when commits land in quick succession
# (the older run shows as "cancelled" — expected, not a failure).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Note: whether Railway waits for this CI is a RAILWAY PANEL setting ("Wait for
# CI") — verify it there, not here. If it is off, a red run never blocks the
# deploy (regressions surface but ship); if on, red blocks. Keep this comment
# claim-free so it can't drift from the panel state.
jobs:
  verify:
    runs-on: ubuntu-latest
    # Deploy dalinin uzun omurlu PR'ini ATLA — o commit'ler zaten `push`
    # tetikleyicisiyle kosuyor; filtresiz `pull_request` her push'u IKINCI kez
    # (merge ref'ine karsi) kosturuyordu. `head_ref` yalniz pull_request
    # olaylarinda dolar, push'ta bostur → bu kosul push'ta DAIMA dogru.
    if: github.head_ref != 'claude/great-edison-3zqpZ'
    # Debian container runs as root, which the integration test global-setup
    # needs (it provisions its own PostgreSQL on :5433 via `su postgres`).
    container:
      image: node:22-bookworm
    steps:
      # TAM GEÇMİŞ — yalnız bu job'da. Dedupe apply'ının güvenlik kapısı
      # `git merge-base --is-ancestor <Faz A> <deploy SHA>` ile çalışır; sığ
      # (varsayılan depth=1) bir checkout'ta Faz A commit'i NESNE OLARAK
      # bulunmaz ve kapı doğru şekilde reddeder — ama o zaman testler
      # gerçek ancestry'yi hiç sınayamaz. build/e2e/migration-chain job'ları
      # git geçmişine bakmadığı için BİLİNÇLİ olarak sığ bırakıldı.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL (for the integration test harness)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql postgresql-contrib sudo
          rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # The gap the test harness can't catch: it uses `prisma db push`, so a broken
  # or drifting MIGRATION chain only surfaces at deploy (`migrate deploy` at
  # boot). Replay 00→N on a fresh Postgres, then assert migrations ↔
  # schema.prisma have ZERO drift — the same protocol done by hand until now.
  migration-chain:
    runs-on: ubuntu-latest
    # Deploy dalinin uzun omurlu PR'ini ATLA — o commit'ler zaten `push`
    # tetikleyicisiyle kosuyor; filtresiz `pull_request` her push'u IKINCI kez
    # (merge ref'ine karsi) kosturuyordu. `head_ref` yalniz pull_request
    # olaylarinda dolar, push'ta bostur → bu kosul push'ta DAIMA dogru.
    if: github.head_ref != 'claude/great-edison-3zqpZ'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create chain + shadow databases
        run: |
          psql "postgresql://postgres@localhost:5432/postgres" -c 'CREATE DATABASE chain;'
          psql "postgresql://postgres@localhost:5432/postgres" -c 'CREATE DATABASE shadow;'
      - name: migrate deploy 00→N on a fresh database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/chain
      - name: Zero-drift check (migrations ↔ schema.prisma)
        run: >-
          npx prisma migrate diff
          --from-migrations ./prisma/migrations
          --to-schema-datamodel ./prisma/schema.prisma
          --shadow-database-url postgresql://postgres@localhost:5432/shadow
          --exit-code

  # E2E smoke (Codex gate): the REAL production build served against a seeded
  # Postgres — catches "app doesn't boot / landing 500s / auth broken end-to-end",
  # which no unit test sees. Kept tiny (2 tests) so it stays fast and unflaky.
  e2e:
    runs-on: ubuntu-latest
    # Deploy dalinin uzun omurlu PR'ini ATLA — o commit'ler zaten `push`
    # tetikleyicisiyle kosuyor; filtresiz `pull_request` her push'u IKINCI kez
    # (merge ref'ine karsi) kosturuyordu. `head_ref` yalniz pull_request
    # olaylarinda dolar, push'ta bostur → bu kosul push'ta DAIMA dogru.
    if: github.head_ref != 'claude/great-edison-3zqpZ'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/e2e
      # A real (non-placeholder) secret — the production boot assertion refuses
      # the dev placeholder by design.
      AUTH_SECRET: ci-e2e-secret-not-used-outside-this-job-42
      # The production boot gate now REQUIRES a mail provider (verify-env). This
      # job never sends mail (2-test smoke), so give it a dummy key purely to
      # satisfy the gate — it is NOT a real Resend key and no send path runs here.
      RESEND_API_KEY: ci-e2e-provider-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Create + migrate + seed the E2E database
        run: |
          psql "postgresql://postgres@localhost:5432/postgres" -c 'CREATE DATABASE e2e;'
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - name: Build (production)
        run: npm run build
      - name: Playwright smoke
        run: npx playwright test

  # Production build gate (DB-free — dummy env values satisfy module-level env
  # readers; nothing connects at build time).
  build:
    runs-on: ubuntu-latest
    # Deploy dalinin uzun omurlu PR'ini ATLA — o commit'ler zaten `push`
    # tetikleyicisiyle kosuyor; filtresiz `pull_request` her push'u IKINCI kez
    # (merge ref'ine karsi) kosturuyordu. `head_ref` yalniz pull_request
    # olaylarinda dolar, push'ta bostur → bu kosul push'ta DAIMA dogru.
    if: github.head_ref != 'claude/great-edison-3zqpZ'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: next build (via npm script — includes prisma generate)
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/build_dummy
          AUTH_SECRET: ci-build-only-secret-not-used-anywhere-42

  # BAGIMLILIK ZAFIYET KAPISI (08-05). "Proactive patching" is an explicit
  # obligation in the API-partner terms we are working toward, and the honest
  # answer to "how do you know?" has to be a mechanism, not a habit.
  #
  # The gate does NOT demand zero vulnerabilities — today four production
  # advisories exist whose fix requires a BREAKING major (next@16, nodemailer@9),
  # so a plain `npm audit --audit-level=high` would pin CI red forever, and a
  # permanently red gate is a gate nobody reads. It demands zero UNTRIAGED
  # vulnerabilities instead: security/audit-baseline.json records each accepted
  # advisory with a reachability argument AND an expiry, and the script fails on
  # (a) anything new and (b) anything whose acceptance has gone stale.
  #
  # Own job on purpose: when this is the red one, the job name says so and the
  # four correctness gates above stay visibly green. Folding it into `build`
  # would cost fewer minutes but would report a dependency advisory as a BUILD
  # failure — the misleading-signal trap.
  #
  # ⚠️ CI DAKIKASI: ~1 dk/push. Private repo Free planda ayda 2000 dk ve bir push
  # zaten ~8 job-dk → tavan ~250'den ~222 push/aya iner. Kota bir gun sikisirsa
  # kaldirac BUDUR: bu job'i `if: github.event_name == 'pull_request'` yaparak
  # yalniz bagimlilik degisikliklerinde kostur (bedeli: mevcut bir bagimlilik
  # icin YENI yayimlanan bir danisma bir sonraki PR'a kadar gorunmez).
  #
  # ⚠️ `schedule:` DENENMEDI, cunku KOSMAZ: zamanlanmis is akislari VARSAYILAN
  # dalda kosar, bu repoda varsayilan dal `main` ve `main` deploy dalinin 1078
  # commit gerisinde — package-lock.json'u bile YOK. Zamanlanmis bir denetim bos
  # bir agaci denetlerdi.
  #
  # NOT: needs no DB, no secrets, no build — just the registry.
  security-audit:
    runs-on: ubuntu-latest
    if: github.head_ref != 'claude/great-edison-3zqpZ'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` degil: audit yalnizca package-lock.json'u okur, bagimliliklarin
      # kurulmasina gerek yok (ve kurmamak, denetlenen agacin postinstall
      # script'lerini CI'da kosturmamak demektir).
      - name: Zafiyet triaj kapisi
        run: node scripts/audit-check.mjs
